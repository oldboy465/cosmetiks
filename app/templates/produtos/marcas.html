{% extends 'base.html' %}

{% block content %}
<div class="header-panel">
    <div>
        <h1>Marcas</h1>
        <p style="color: var(--text-muted);">Gerencie as marcas do seu portfólio (ex: Avon, Natura, Boticário)</p>
    </div>
</div>

<div class="dashboard-row">
    <div class="form-container">
        <div style="font-weight: 700; margin-bottom: 15px;">Nova Marca</div>
        <form action="{{ url_for('marca.nova') }}" method="POST">
            <div class="form-group" style="margin-bottom: 15px;">
                <label class="form-label">Nome da Marca</label>
                <input type="text" name="nome" class="form-control" required>
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label class="form-label">Descrição (Opcional)</label>
                <textarea name="descricao" class="form-control" rows="2"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Cadastrar Marca</button>
        </form>
    </div>

    <div class="data-table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Marca</th>
                    <th>Total de Itens</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for m in marcas %}
                <tr>
                    <td>
                        <strong>{{ m.nome }}</strong>
                        <div style="font-size: 12px; color: var(--text-muted);">{{ m.descricao or '' }}</div>
                    </td>
                    <td>{{ m.produtos|length }}</td>
                    <td>
                        <form action="{{ url_for('marca.excluir', id_marca=m.id) }}" method="POST" onsubmit="return confirm('Deseja excluir esta marca?')">
                            <button type="submit" class="btn btn-danger" style="padding: 5px 10px;">Excluir</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
