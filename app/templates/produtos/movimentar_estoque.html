{% extends 'base.html' %}

{% block content %}
<div class="header-panel">
    <div>
        <h1>Movimentação de Estoque</h1>
        <p style="color: var(--text-muted);">Entradas manuais (compras) ou saídas (perdas/ajustes)</p>
    </div>
</div>

<div class="form-container" style="max-width: 600px; margin: 0 auto;">
    <form action="{{ url_for('estoque.movimentar') }}" method="POST">
        <div class="form-group" style="margin-bottom: 15px;">
            <label class="form-label">Selecione o Produto</label>
            <select name="produto_id" class="form-control" required>
                {% for p in produtos %}
                <option value="{{ p.id }}">{{ p.nome }} (Atual: {{ p.quantidade_estoque }} un)</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
            <div class="form-group">
                <label class="form-label">Tipo</label>
                <select name="tipo" class="form-control" required>
                    <option value="Entrada">Entrada</option>
                    <option value="Saida">Saída</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Motivo</label>
                <select name="motivo" class="form-control" required>
                    <option value="Compra">Compra</option>
                    <option value="Ajuste">Ajuste de Inventário</option>
                    <option value="Perda">Perda / Avaria</option>
                    <option value="Devolucao">Devolução</option>
                </select>
            </div>
        </div>

        <div class="form-group" style="margin-top: 15px;">
            <label class="form-label">Quantidade</label>
            <input type="number" name="quantidade" class="form-control" min="1" value="1" required>
        </div>

        <div class="form-group" style="margin-top: 15px;">
            <label class="form-label">Observações</label>
            <textarea name="observacoes" class="form-control" rows="3" placeholder="Ex: Referente à nota fiscal 123..."></textarea>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('estoque.historico') }}" class="btn btn-danger" style="background: #ccc; color: #333;">Cancelar</a>
            <button type="submit" class="btn btn-success">Processar Movimentação</button>
        </div>
    </form>
</div>
{% endblock %}
