{% extends 'base.html' %}

{% block content %}
<div class="header-panel">
    <div>
        <h1>Nova Entidade Revendedor</h1>
        <p style="color: var(--text-muted);">Isolamento total de dados e regras de acesso exclusivas</p>
    </div>
</div>

<div class="form-container">
    <form action="{{ url_for('admin.novo_revendedor') }}" method="POST">
        <div style="font-weight: 700; color: var(--primary-color); margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">Dados Gerais</div>
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Nome Completo</label>
                <input type="text" name="nome_completo" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">CPF</label>
                <input type="text" name="cpf" class="form-control" oninput="Utils.mascararCPF(this)" placeholder="000.000.000-00" required>
            </div>
            <div class="form-group">
                <label class="form-label">Data de Nascimento</label>
                <input type="date" name="data_nascimento" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Sexo</label>
                <select name="sexo" class="form-control">
                    <option value="Feminino">Feminino</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Não Informado">Não Informado</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Telefone</label>
                <input type="text" name="telefone" class="form-control" oninput="Utils.mascararTelefone(this)">
            </div>
            <div class="form-group">
                <label class="form-label">WhatsApp</label>
                <input type="text" name="whatsapp" class="form-control" oninput="Utils.mascararTelefone(this)">
            </div>
            <div class="form-group">
                <label class="form-label">E-mail</label>
                <input type="email" name="email" class="form-control" required>
            </div>
        </div>

        <div style="font-weight: 700; color: var(--primary-color); margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; margin-top: 20px;">Endereço</div>
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">CEP</label>
                <input type="text" name="cep" class="form-control" oninput="Utils.mascararCEP(this)">
            </div>
            <div class="form-group">
                <label class="form-label">Logradouro</label>
                <input type="text" name="logradouro" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Número</label>
                <input type="text" name="numero" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Complemento</label>
                <input type="text" name="complemento" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Bairro</label>
                <input type="text" name="bairro" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Cidade</label>
                <input type="text" name="cidade" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Estado</label>
                <input type="text" name="estado" class="form-control" maxlength="2">
            </div>
        </div>

        <div style="font-weight: 700; color: var(--primary-color); margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; margin-top: 20px;">Credenciais de Segurança</div>
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Usuário</label>
                <input type="text" name="usuario" class="form-control" required autocomplete="off">
            </div>
            <div class="form-group">
                <label class="form-label">Senha de Acesso</label>
                <input type="password" name="senha" class="form-control" required>
            </div>
        </div>

        <div class="form-group full-width" style="margin-top: 15px;">
            <label class="form-label">Observações Livres</label>
            <textarea name="observacoes" class="form-control" rows="3"></textarea>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('admin.listar_revendedores') }}" class="btn btn-danger" style="background: #ccc; color: #333;">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar Cadastro</button>
        </div>
    </form>
</div>
{% endblock %}
